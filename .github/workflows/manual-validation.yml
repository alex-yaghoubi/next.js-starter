name: Manual package validation

# Intentionally manual-only. Does not gate commits, merges or deployments.
on:
  workflow_dispatch:
    inputs:
      build_template:
        description: Install and build the zero-config basic template
        type: boolean
        required: false
        default: true
      build_appointment:
        description: Optionally attempt a build of the legacy appointment example
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  cli-smoke:
    name: CLI smoke tests and packed-consumer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install CLI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run CLI tests
        run: npm test
      - name: Inspect npm contents
        run: npm pack --dry-run
      - name: Test npm tarball in an isolated consumer
        run: |
          archive=$(npm pack --silent)
          consumer=$(mktemp -d)
          npm install --prefix "$consumer" "$GITHUB_WORKSPACE/$archive" --ignore-scripts --no-audit --no-fund
          cd "$consumer"
          ./node_modules/.bin/create-nextjs-standard-app sample-app --skip-install --no-git
          test -f 'sample-app/app/[locale]/page.tsx'
          test -f sample-app/messages/fa.json
          test ! -f sample-app/.env.local
          test -f sample-app/.gitignore
          ./node_modules/.bin/create-nextjs-standard-app booking-demo --template appointment --skip-install --no-git
          test -f booking-demo/.env.local

  basic-build:
    name: Basic starter typecheck and Next.js build
    if: inputs.build_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install basic starter
        working-directory: starter-basic
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: starter-basic
        run: npm run typecheck
      - name: Build Next.js basic starter
        working-directory: starter-basic
        run: npm run build
      - name: Run localized pages and verify English, Persian and RTL
        working-directory: starter-basic
        shell: bash
        run: |
          npm run start -- --port 3100 > /tmp/nextjs-starter-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3100/en > /tmp/starter-en.html; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3100/fa > /tmp/starter-fa.html
          grep -q 'lang="en"' /tmp/starter-en.html
          grep -q 'dir="ltr"' /tmp/starter-en.html
          grep -q 'lang="fa"' /tmp/starter-fa.html
          grep -q 'dir="rtl"' /tmp/starter-fa.html
          grep -q 'Build something great' /tmp/starter-en.html
          grep -q 'ایده' /tmp/starter-fa.html
          echo "Localized HTTP smoke test passed"

  appointment-build:
    name: Optional legacy Appointment template build
    if: inputs.build_appointment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install legacy template
        working-directory: starter-template
        run: npm install --no-audit --no-fund
      - name: Generate ephemeral local auth secret
        run: node -e 'process.stdout.write("NEXTAUTH_SECRET=" + require("node:crypto").randomBytes(32).toString("hex") + "\n")' >> "$GITHUB_ENV"
      - name: Build example
        working-directory: starter-template
        env:
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build
